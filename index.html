<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Kazakova — Portfolio</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f3f0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }
        .bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-svg svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Базовый стиль для всех контуров */
        .draw-path {
            fill: none;
            stroke: #12a190;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

/* ----- СКРЫВАЕМ ВЕРТИКАЛЬНЫЙ SVG НА ДЕСКТОПАХ ----- */
/* ----- МОБИЛЬНЫЙ SVG (вертикальный 9:16) ----- */
.bg-svg-mobile {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    visibility: hidden;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.bg-svg-mobile svg {
    display: block;
    width: 100%;
    height: 100%;
    /* Важно: preserveAspectRatio должен быть на SVG, а не в CSS */
    /* Но мы добавим его через атрибут к тегу <svg> */
}

/* ----- ПОКАЗЫВАЕМ МОБИЛЬНЫЙ SVG НА МОБИЛЬНЫХ ----- */
@media (max-width: 768px) {
    .bg-svg-desktop {
        visibility: hidden;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    
    .bg-svg-mobile {
        visibility: visible;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
}
        /* ----- СЛОЙ С ФЛАГАМИ (ПОВЕРХ ФОНА) ----- */
        .flags-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .flag-item {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.25s ease;
            width: 80px;
            height: 52px;
            transform: translate(-50%, -50%);
            background: none;
            filter: none;
        }
        .flag-item:hover {
            transform: translate(-50%, -50%) scale(1.25);
        }
        .flag-item svg {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
            border: none;
            box-shadow: none;
        }

        /* Позиции флагов (настраиваются под вертикальный SVG) */
        .flag-1 { left: 24%; top: 43.5%; }
        .flag-2 { left: 31.1%; top: 43.5%; }
        .flag-3 { left: 38.3%; top: 43.5%; }
        .flag-4 { left: 56.5%; top: 43.3%; }
        .flag-5 { left: 63.7%; top: 43.3%; }
        .flag-6 { left: 70.8%; top: 43.3%; }

/* Мобильные флаги — обновленные координаты для фрейма 445×791 */
@media (max-width: 768px) {
    .flag-item {
        width: 48px;
        height: 32px;
    }
    .flag-1 { left: 45%; top: 37%; }  /* Россия */
    .flag-2 { left: 55%; top: 37%; }  /* Британия */
    .flag-4 { left: 45%; top: 44%; }  /* Греция */
    .flag-5 { left: 55%; top: 44%; }  /* Турция */
    .flag-3 { left: 45%; top: 51%; }  /* Китай */
    .flag-6 { left: 55%; top: 51%; }  /* Германия */
}

@media (max-width: 480px) {
    .flag-item {
        width: 36px;
        height: 24px;
    }
    .flag-1 { left: 45%; top: 37%; }
    .flag-2 { left: 55%; top: 37%; }
    .flag-4 { left: 45%; top: 44%; }
    .flag-5 { left: 55%; top: 44%; }
    .flag-3 { left: 45%; top: 51%; }
    .flag-6 { left: 55%; top: 51%; }
}
    </style>
</head>

<script>
        document.addEventListener('DOMContentLoaded', async () => {
            const paths = Array.from(document.querySelectorAll('svg .draw-path'));

            // Сначала полностью скрываем все контуры.
            paths.forEach(path => {
                const length = path.getTotalLength();
                path.style.strokeDasharray = `${length} ${length}`;
                path.style.strokeDashoffset = length;
            });

            // Рисуем path строго последовательно.
            // Каждый следующий path запускается только после завершения предыдущего.
            for (const path of paths) {
                const length = path.getTotalLength();

                // Скорость рисования адаптируется к длине конкретного контура:
                // короткие детали появляются быстро, длинные линии — чуть медленнее.
                const duration = Math.min(700, Math.max(60, length * 0.0025));

                const animation = path.animate(
                    [
                        { strokeDashoffset: length },
                        { strokeDashoffset: 0 }
                    ],
                    {
                        duration: duration,
                        easing: 'ease-in-out',
                        fill: 'forwards'
                    }
                );

                // Ждём окончания текущего контура.
                // Благодаря этому уже нарисованная линия остаётся на месте.
                await animation.finished;

                // Фиксируем финальное состояние непосредственно в SVG,
                // чтобы линия гарантированно оставалась видимой.
                path.style.strokeDashoffset = '0';
            }
        });
document.addEventListener('DOMContentLoaded', () => {
    const paths = Array.from(document.querySelectorAll('svg .draw-path'));
    
    paths.forEach(path => {
        const length = path.getTotalLength();
        const duration = Math.min(700, Math.max(60, length * 0.0025));
        
        path.style.setProperty('--length', length);
        path.style.setProperty('--duration', duration + 'ms');
        path.style.strokeDasharray = `${length} ${length}`;
        path.style.strokeDashoffset = length;
    });
});
</script>
