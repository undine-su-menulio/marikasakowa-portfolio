<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Kazakova — Portfolio</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f3f0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }
        .bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-svg svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Базовый стиль для всех контуров */
        .draw-path {
            fill: none;
            stroke: #12a190;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

/* ----- СЛОЙ С ФЛАГАМИ (ПОВЕРХ ФОНА) ----- */
.flags-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
}

.flag-item {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.25s ease;
    width: 70px;
    height: 48px;
    transform: translate(-50%, -50%);
    /* Убираем фоновую заливку и тени */
    background: none;
    filter: none;
}
.flag-item:hover {
    transform: translate(-50%, -50%) scale(1.25);
    /* Тени больше нет */
}
.flag-item svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
    /* Убираем border и box-shadow, если они не нужны */
    border: none;
    box-shadow: none;
}

        /* Позиции флагов */
        .flag-1 { left: 26%; top: 49%; }
        .flag-2 { left: 33.1%; top: 49%; }
        .flag-3 { left: 40.3%; top: 49%; }
        .flag-4 { left: 58.5%; top: 49%; }
        .flag-5 { left: 65.7%; top: 49%; }
        .flag-6 { left: 72.8%; top: 49%; }

    </style>
</head>

<script>
        document.addEventListener('DOMContentLoaded', async () => {
            const paths = Array.from(document.querySelectorAll('svg .draw-path'));

            // Сначала полностью скрываем все контуры.
            paths.forEach(path => {
                const length = path.getTotalLength();
                path.style.strokeDasharray = `${length} ${length}`;
                path.style.strokeDashoffset = length;
            });

            // Рисуем path строго последовательно.
            // Каждый следующий path запускается только после завершения предыдущего.
            for (const path of paths) {
                const length = path.getTotalLength();

                // Скорость рисования адаптируется к длине конкретного контура:
                // короткие детали появляются быстро, длинные линии — чуть медленнее.
                const duration = Math.min(700, Math.max(60, length * 0.0025));

                const animation = path.animate(
                    [
                        { strokeDashoffset: length },
                        { strokeDashoffset: 0 }
                    ],
                    {
                        duration: duration,
                        easing: 'ease-in-out',
                        fill: 'forwards'
                    }
                );

                // Ждём окончания текущего контура.
                // Благодаря этому уже нарисованная линия остаётся на месте.
                await animation.finished;

                // Фиксируем финальное состояние непосредственно в SVG,
                // чтобы линия гарантированно оставалась видимой.
                path.style.strokeDashoffset = '0';
            }
        });
    </script>
